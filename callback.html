<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Authorization</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 64px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  .box { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; word-break: break-all; font-family: ui-monospace, monospace; font-size: 0.95rem; }
  .label { font-weight: 600; margin-top: 1.5rem; }
  .error { color: #c4003c; }
</style>
</head>
<body>
<h1>Authorization complete</h1>
<p>Copy the code below and paste it back into the terminal.</p>
<div class="label">code</div>
<div class="box" id="code">(none found)</div>
<div class="label">state</div>
<div class="box" id="state">(none found)</div>
<div id="err" class="error"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error_description") || params.get("error");
  if (code) document.getElementById("code").textContent = code;
  if (state) document.getElementById("state").textContent = state;
  if (error) document.getElementById("err").textContent = "Error: " + error;
</script>
</body>
</html>
